<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Iniciar Sesión — Pagos Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pagos Pro">
    <link rel="apple-touch-icon" href="icono.png">
    <link rel="stylesheet" href="style.css?v=2.0">
</head>

<body class="ios-body">
    <div id="network-banner" class="network-banner hidden">
        <span class="dot-offline"></span>
        <span>Modo sin conexión — Necesitas internet para iniciar sesión por primera vez</span>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="app-logo-badge">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="3"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                    <line x1="6" y1="15" x2="10" y2="15"></line>
                </svg>
            </div>
            <h1>Pagos Pro</h1>
            <p class="subtitle">Panel de Administración y Cobranza</p>

            <form id="login-form" class="ios-form">
                <div class="ios-input-card">
                    <div class="ios-field">
                        <label for="email">Correo</label>
                        <input type="email" id="email" required placeholder="admin@correo.com" autocomplete="email">
                    </div>
                    <div class="ios-divider"></div>
                    <div class="ios-field">
                        <label for="password">Clave</label>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn-ios-primary">
                    <span>Continuar</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <p id="error-message" class="error-toast" style="display: none;"></p>

            <div class="login-footer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Sincronización segura con soporte Offline</span>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=2.0"></script>
</body>

</html>
